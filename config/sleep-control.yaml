
# To use this module, you must have these definitions in your main yaml file:
# api:
#   id: gs_api
# wifi:
#   id: wifi_wificomponent_id # For some reason, if any other id name is used this won't compile

# You may override these in your main yaml file
substitutions:
  wait_for_initial_setup_duration: 5min
  wait_for_wifi_duration: 10s
  wait_for_api_connection_duration: 30s
  wait_after_initial_api_connection: 5min
  run_duration: 45s
  sleep_duration: 30min
  home_assistant_ota_entity_id: input_boolean.ota_update_mode

# -----------------------------------------------------------------------------
# Everything below is related to setup that inhibits deep-sleep during initial
# setup.  Normally, nothing below should need to be modified.
# -----------------------------------------------------------------------------

# Deep sleep configuration
# Note that the script below for OTA updates will inhibit this so run_duration here is irrelevant
deep_sleep:
  id: deep_sleep_1
  run_duration: ${run_duration}
  sleep_duration: ${sleep_duration}

# Text sensors
text_sensor:
  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    update_interval: 1s
    internal: True # Hide from home assisstant

# Scripts
script:
  # Script that controls the timer for how long to wait for initial setup
  - id: scr_wait_for_initial_setup
    then:
      - delay: ${wait_for_initial_setup_duration}
  # Script that controls the timer for how long to wait for wifi
  - id: scr_timer_wait_for_wifi
    then:
      - delay: ${wait_for_wifi_duration}
  # Script that controls the timer for how long we look for the HA connection
  - id: scr_timer_wait_for_api_connection
    then:
      - delay: ${wait_for_api_connection_duration}
  # Script that controls the timer for how long to wait after initial api connection (for user to examine device etc)
  - id: scr_wait_after_initial_api_connection
    then:
      - delay: ${wait_after_initial_api_connection}

  # Main script that runs on boot to control if we go to sleep or stay awake (for setup, OTA update etc.)
  - id: scr_sleep_control
    then:
      - deep_sleep.prevent: deep_sleep_1
      - lambda: 'id(ota_sleep_control_state) = 1;'
      - delay: 1s # allow other tasks to get going first
      - if: # First check if WiFi credentials are stored
          condition:
            lambda: 'return !id(wifi_wificomponent_id).has_sta();'
          then:
            - logger.log:
                format: "No WiFi credentials are stored -- staying awake for ${wait_for_initial_setup_duration} to allow initial setup."
                level: WARN
            - lambda: |- # Force AP on (this may not be needed because of default behavior)
                id(wifi_wificomponent_id).set_ap_timeout(1);
                id(wifi_wificomponent_id).enable();
                id(ota_sleep_control_state) = 2;
            - script.execute: scr_wait_for_initial_setup
            - logger.log:
                format: "Waiting for initial WiFi setup..."
                level: INFO
            - while: # While our timer is running AND we haven't yet connected to WiFi
                condition:
                  lambda: 'return (id(scr_wait_for_initial_setup).is_running() && !id(wifi_wificomponent_id).is_connected());'
                then:
                  - delay: 1s
            - if: # If we still aren't connected to WiFi goto sleep to save the battery
                condition:
                  lambda: 'return !id(wifi_wificomponent_id).is_connected();'
                then:
                  - deep_sleep.enter: deep_sleep_1
      # Now Check for WiFi connection
      - script.execute: scr_timer_wait_for_wifi
      - lambda: 'id(ota_sleep_control_state) = 3;'
      - logger.log:
          format: "Waiting for WiFi connection..."
          level: INFO
      - while: # While our timer is running AND we haven't yet connected to WiFi
          condition:
            lambda: 'return (id(scr_timer_wait_for_wifi).is_running() && !id(wifi_wificomponent_id).is_connected());'
          then:
            - delay: 1s
      - if: # If we are not connected to WiFi but credentials are stored
          condition:
            lambda: 'return !id(wifi_wificomponent_id).is_connected() && id(wifi_wificomponent_id).has_sta();'
          then:
            - logger.log:
                format: "WiFi not connected, but credentials are stored -- sleeping to save battery."
                level: WARN
            - deep_sleep.enter: deep_sleep_1
      # Now connected to WiFi
      - if: # If API has never been connected once
          condition:
            lambda: 'return id(ota_sleep_control_api_setup) == 0;'
          then:
            # Reset the initial setup timer and give the user more time to configure in Home Assistant etc.
            - lambda: 'id(ota_sleep_control_state) = 4;'
            - script.stop: scr_wait_for_initial_setup
            - script.execute: scr_wait_for_initial_setup
            - logger.log:
                format: "Waiting for initial API setup..."
                level: INFO
            - while: # While the setup timer is running and we aren't connected to the API
                condition:
                  lambda: 'return (id(scr_wait_for_initial_setup).is_running() && !id(gs_api).is_connected());'
                then:
                  - delay: 1s
      # Now wait for API connection
      - lambda: 'id(ota_sleep_control_state) = 5;'
      - script.execute: scr_timer_wait_for_api_connection
      - logger.log:
          format: "Waiting for API connection..."
          level: INFO
      - while: # While our timer is running AND we aren't connected to Home Assistant
          condition:
            lambda: 'return (id(scr_timer_wait_for_api_connection).is_running() && !id(gs_api).is_connected());'
          then:
            - delay: 1s
      - if: # If API is still not connected
          condition:
            lambda: 'return !id(gs_api).is_connected();'
          then:
            - logger.log:
                format: "No API connection -- sleeping to save battery."
                level: WARN
            - delay: 1s
            - deep_sleep.enter: deep_sleep_1
      # Now API is connected
      - lambda: 'id(ota_sleep_control_state) = 6;'
      - if: # If we just did initial setup, we stay awake for a bit for the user to see it working...
          condition:
            lambda: 'return id(ota_sleep_control_api_setup) == 0;'
          then:
            # Reset the initial setup timer and give the user more time to configure in Home Assistant etc.
            - lambda: 'id(ota_sleep_control_state) = 7;'
            - script.stop: scr_wait_after_initial_api_connection
            - script.execute: scr_wait_after_initial_api_connection
            - logger.log:
                format: "Preventing sleep for '${wait_after_initial_api_connection}' after initial setup."
                level: INFO
            - while: # While the setup timer is running
                condition:
                  lambda: 'return id(scr_wait_after_initial_api_connection).is_running();'
                then:
                  - delay: 1s
            - lambda: 'id(ota_sleep_control_api_setup) = 1;'
            - logger.log:
                format: "Initial setup marked as complete."
                level: INFO

      # Reset state and allow sleep when finished
      - lambda: 'id(ota_sleep_control_state) = 0;'
      - deep_sleep.allow: deep_sleep_1

# Globals
globals:
  # OTA sleep control state
  - id: ota_sleep_control_state
    type: int
    restore_value: no
    initial_value: '0'
  # Persistent flag regarding if API has ever connected at least once
  - id: ota_sleep_control_api_setup
    type: int
    restore_value: yes
    initial_value: '0'
